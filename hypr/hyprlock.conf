# ============================================================
#  hyprlock — Material You · glass card layout
#  Wallpaper picked randomly by lock.sh → /tmp/hyprlock-wallpaper
#  Palette sourced from hyprlock-colors.conf (matugen)
# ============================================================

$Scripts = $HOME/.config/hypr/scripts
source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    no_fade_in          = false
    no_fade_out         = false
    hide_cursor         = true
    grace               = 0
    disable_loading_bar = true
    ignore_empty_input  = true
}

# ---------- Blurred wallpaper background ----------
background {
    monitor     =
    path        = /tmp/hyprlock-wallpaper
    blur_passes = 2
    blur_size   = 4
    brightness  = 0.75
    contrast    = 1.00
    vibrancy    = 0.15
    noise       = 0.0117
}

# ---------- Greeting ----------
label {
    monitor     =
    text        = cmd[update:60000] bash -c 'h=$(date +%H); if [ $h -lt 5 ]; then echo "Still Awake?"; elif [ $h -lt 12 ]; then echo "Good Morning"; elif [ $h -lt 17 ]; then echo "Good Afternoon"; elif [ $h -lt 21 ]; then echo "Good Evening"; else echo "Good Night"; fi'
    color       = $mat_primary
    font_size   = 30
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $mat_shadow
    position    = 0, 400
    halign      = center
    valign      = center
}

# ---------- Hour (top line of stacked clock) ----------
label {
    monitor       =
    text          = cmd[update:1000] date +"%I"
    color         = $mat_text
    font_size     = 180
    font_family   = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size   = 6
    shadow_color  = $mat_shadow
    position      = 0, 230
    halign        = center
    valign        = center
}

# ---------- Minute (bottom line of stacked clock) ----------
label {
    monitor       =
    text          = cmd[update:1000] date +"%M"
    color         = $mat_text
    font_size     = 180
    font_family   = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size   = 6
    shadow_color  = $mat_shadow
    position      = 0, -10
    halign        = center
    valign        = center
}

# ---------- AM / PM (small, right of the minute line) ----------
label {
    monitor       =
    text          = cmd[update:60000] date +"%p"
    color         = $mat_primary
    font_size     = 22
    font_family   = JetBrainsMono Nerd Font Bold
    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = $mat_shadow
    position      = 180, 30
    halign        = center
    valign        = center
}

# ---------- Date ----------
label {
    monitor       =
    text          = cmd[update:60000] date +"%A · %B %-d"
    color         = $mat_subtext
    font_size     = 15
    font_family   = JetBrainsMono Nerd Font Medium
    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = $mat_shadow
    position      = 0, -140
    halign        = center
    valign        = center
}

# ---------- Input field ----------
input-field {
    monitor           =
    size              = 360, 38
    outline_thickness = 2
    dots_size         = 0.22
    dots_spacing      = 0.32
    dots_center       = true
    outer_color       = $mat_primary
    inner_color       = $mat_inner
    font_color        = $mat_text
    fade_on_empty     = true
    rounding          = 29
    check_color       = $mat_check
    fail_color        = $mat_fail
    fail_text         = <i>$FAIL attempt$PAMFAIL</i>
    placeholder_text  = <span>   Enter password</span>
    hide_input        = false
    shadow_passes     = 3
    shadow_size       = 6
    shadow_color      = $mat_shadow
    position          = 0, -270
    halign            = center
    valign            = center
}

# ---------- User ----------
label {
    monitor       =
    text          =   $USER@$(hostname 2>/dev/null || echo God Is Good All The Time)
    color         = $mat_subtext
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font Medium
    shadow_passes = 1
    shadow_size   = 2
    shadow_color  = $mat_shadow
    position      = 0, -380
    halign        = center
    valign        = center
}

# ---------- Now-playing (only visible if a player is active) ----------
label {
    monitor       =
    text          = cmd[update:2000] bash -c 'p=$(playerctl status 2>/dev/null); if [ "$p" = "Playing" ] || [ "$p" = "Paused" ]; then i=""; [ "$p" = "Paused" ] && i=""; t=$(playerctl metadata title 2>/dev/null | cut -c1-38); a=$(playerctl metadata artist 2>/dev/null | cut -c1-28); echo "$i  $t — $a"; fi'
    color         = $mat_text
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font Medium
    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = $mat_shadow
    position      = 0, 70
    halign        = center
    valign        = bottom
}

# ---------- Status row · Battery ----------
label {
    monitor       =
    text          = cmd[update:30000] bash -c 'c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); s=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); if [ -n "$c" ]; then i=""; [ "$s" = "Charging" ] && i=""; [ "$c" -lt 20 ] && i=""; [ "$c" -lt 50 ] && [ -z "$i" ] && i=""; [ -z "$i" ] && i=""; echo "$i  $c%"; fi'
    color         = $mat_text
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font Medium
    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = $mat_shadow
    position      = -40, 40
    halign        = right
    valign        = bottom
}

# ---------- Status row · Network ----------
label {
    monitor       =
    text          = cmd[update:30000] bash -c 's=$(nmcli -t -f ACTIVE,SSID dev wifi 2>/dev/null | grep "^yes" | cut -d: -f2); if [ -n "$s" ]; then echo "  $s"; else echo "  offline"; fi'
    color         = $mat_text
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font Medium
    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = $mat_shadow
    position      = 40, 40
    halign        = left
    valign        = bottom
}
