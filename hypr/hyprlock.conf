# ============================================================
#  hyprlock — Catppuccin Mocha
#  Wallpaper is picked randomly by lock.sh → /tmp/hyprlock-wallpaper
# ============================================================

$Scripts = $HOME/.config/hypr/scripts

general {
    no_fade_in        = false
    no_fade_out       = false
    hide_cursor       = true
    grace             = 0
    disable_loading_bar = true
}

# ---------- Background (random wallpaper via lock.sh) ----------
background {
    monitor     =
    path        = /tmp/hyprlock-wallpaper
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.60
    contrast    = 0.90
    vibrancy    = 0.15
}

# ---------- Clock ----------
label {
    monitor       =
    text          = cmd[update:1000] echo "$(date +"%-I:%M")"
    color         = rgba(205, 214, 244, 1.0)
    font_size     = 88
    font_family   = JetBrainsMono Nerd Font Mono ExtraBold
    shadow_passes = 3
    shadow_size   = 5
    shadow_color  = rgba(0, 0, 0, 0.50)
    position      = 0, 150
    halign        = center
    valign        = center
}

# ---------- AM / PM ----------
label {
    monitor       =
    text          = cmd[update:1000] echo "$(date +"%p")"
    color         = rgba(166, 173, 200, 0.85)
    font_size     = 20
    font_family   = JetBrainsMono Nerd Font Mono Bold
    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.40)
    position      = 0, 68
    halign        = center
    valign        = center
}

# ---------- Date ----------
label {
    monitor       =
    text          = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color         = rgba(205, 214, 244, 0.80)
    font_size     = 16
    font_family   = JetBrainsMono Nerd Font Mono
    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.40)
    position      = 0, 28
    halign        = center
    valign        = center
}

# ---------- User ----------
label {
    monitor       =
    text          =   $USER
    color         = rgba(166, 173, 200, 0.70)
    font_size     = 13
    font_family   = JetBrainsMono Nerd Font Mono
    shadow_passes = 1
    shadow_size   = 2
    shadow_color  = rgba(0, 0, 0, 0.40)
    position      = 0, -58
    halign        = center
    valign        = center
}

# ---------- Input field ----------
input-field {
    monitor           =
    size              = 300, 52
    outline_thickness = 2
    dots_size         = 0.22
    dots_spacing      = 0.30
    dots_center       = true
    outer_color       = rgba(203, 166, 247, 0.85)
    inner_color       = rgba(30, 30, 46, 0.80)
    font_color        = rgba(205, 214, 244, 1.0)
    fade_on_empty     = true
    rounding          = 26
    check_color       = rgba(166, 227, 161, 1.0)
    fail_color        = rgba(243, 139, 168, 1.0)
    fail_text         = <i>$FAIL  ($ATTEMPTS)</i>
    placeholder_text  = <span foreground="##a6adc8">  password</span>
    hide_input        = false
    shadow_passes     = 3
    shadow_size       = 5
    shadow_color      = rgba(0, 0, 0, 0.50)
    position          = 0, -120
    halign            = center
    valign            = center
}
